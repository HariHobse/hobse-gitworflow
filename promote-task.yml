name: Promote Task to Live

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "QA-approved Task ID (example: HOB-102)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release pull request
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$TASK_ID" =~ ^[A-Z][A-Z0-9]*-[0-9]+$ ]]; then
            echo "::error::Enter a Task ID like HOB-102."
            exit 1
          fi

          approval_file=".github/qa-approved/$TASK_ID.txt"
          if [[ ! -s "$approval_file" ]]; then
            echo "::error::No approved commit list found for $TASK_ID."
            exit 1
          fi

          mapfile -t commits < "$approval_file"
          for commit in "${commits[@]}"; do
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]] ||
               ! git cat-file -e "$commit^{commit}"; then
              echo "::error::The approval file must contain one valid full commit SHA per line."
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin live

          branch="release/$TASK_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch --create "$branch" origin/live

          for commit in "${commits[@]}"; do
            if ! git cherry-pick "$commit"; then
              echo "::error::Could not apply $commit. Open the cherry-pick log for details."
              git cherry-pick --abort
              exit 1
            fi
          done

          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --base live \
            --head "$branch" \
            --title "$TASK_ID: Release to Live" \
            --body "Review the changes and verify this release version in QA before merging."